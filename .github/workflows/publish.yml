name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Run tests before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with dev dependencies
        run: pip install -e "packages/noisebridge[dev]"

      - name: Run tests (must pass before publish)
        run: |
          cd packages/noisebridge
          pytest tests/ --cov=noisebridge --cov-fail-under=80 -q

  publish:
    name: Build and publish noisebridge to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: pypi
      url: https://pypi.org/project/noisebridge/

    permissions:
      id-token: write   # required for trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: |
          cd packages/noisebridge
          python -m build

      - name: Verify the tag matches __version__
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('packages/noisebridge/pyproject.toml','rb')); print(d['project']['version'])")
          echo "Tag: $TAG  |  __version__: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: git tag v$TAG does not match package version $VERSION"
            exit 1
          fi

      - name: Publish to PyPI (trusted publishing — no API token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/noisebridge/dist/
