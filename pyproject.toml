# Root pyproject.toml — monorepo tooling config
#
# noisebridge is an external dependency (pip install noisebridge).
# Its source and tests live in MousMou/noisebridge.
#
# To run tests per package:
#   cd packages/api && python -m pytest tests/
#   cd packages/sdk && python -m pytest tests/   (Session 6)

[tool.pytest.ini_options]
testpaths = ["packages/api/tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
