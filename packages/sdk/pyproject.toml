[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractkit"
version = "0.1.0"
description = "FractKit SDK — CLI and Python client for the noisebridge Cloud API"
readme = "README.md"
license = { text = "BSL-1.1" }
requires-python = ">=3.10"
dependencies = [
    "noisebridge>=0.3.0",
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
fractkit = "fractkit.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fractkit*"]
