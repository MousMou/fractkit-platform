AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: noisebridge API — Lambda + API Gateway + DynamoDB

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  StripeSecretKey:
    Type: String
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    NoEcho: true
  StripePriceId:
    Type: String
  SesFromEmail:
    Type: String
    Default: "noreply@fractkit.io"

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref ApiKeysTable
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        STRIPE_PRO_PRICE_ID: !Ref StripePriceId
        STAGE: !Ref Stage
        SES_FROM_EMAIL: !Ref SesFromEmail

Resources:

  # ── DynamoDB ──────────────────────────────────────────────────────────────────
  ApiKeysTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub noisebridge-api-keys-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: api_key
          AttributeType: S
      KeySchema:
        - AttributeName: api_key
          KeyType: HASH

  # ── Lambda function ───────────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub noisebridge-api-${Stage}
      CodeUri: ../../packages/api/
      Handler: app.main.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeysTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  # ── API Gateway (HTTP API) ────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "https://fractkit.io"
          - "https://www.fractkit.io"
          - "https://fractkit-platform-2t79.vercel.app"
        AllowMethods: ["GET", "POST", "OPTIONS"]
        AllowHeaders: ["X-API-Key", "Content-Type"]
        MaxAge: 86400

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub noisebridge-api-url-${Stage}

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
